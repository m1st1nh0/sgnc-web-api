name: API checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pr01-access-scope-feedback-flow, pr02-reincidencia-v2, pr03-workflow-atomic-timeline, pr04-insights-api-v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: offline-test-key
      SUPABASE_SERVICE_ROLE_KEY: offline-test-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Legacy insights aggregation regression
        run: |
          python - <<'PY'
          caminho = "test_insights_offline.py"
          codigo = open(caminho, encoding="utf-8").read()
          codigo = codigo.split("# ------------------- teste via HTTP", 1)[0]
          exec(compile(codigo, caminho, "exec"))
          PY
      - name: PR01 access and V2 route tests
        run: python test_pr01_offline.py
      - name: PR02 recurrence V2 tests
        run: python test_pr02_offline.py
      - name: PR03 atomic workflow and timeline tests
        run: python test_pr03_offline.py
      - name: PR04 Insights API V2 tests
        run: python test_pr04_offline.py
