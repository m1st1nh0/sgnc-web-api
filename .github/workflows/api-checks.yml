name: API checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pr01-access-scope-feedback-flow]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Existing insights tests
        run: python test_insights_offline.py
      - name: PR01 access tests
        run: python test_pr01_offline.py
