name: PR01 production smoke

on:
  push:
    branches: [ops/prod-smoke-pr01]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Render deployed PR01 API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            echo "Attempt ${attempt}/18"
            if curl -fsS --max-time 20 https://sgnc-web-api.onrender.com/openapi.json -o openapi.json; then
              if python - <<'PY'
          import json
          with open('openapi.json', encoding='utf-8') as f:
              doc = json.load(f)
          paths = doc.get('paths', {})
          required = ['/usuarios/opcoes-nc', '/insights']
          missing = [p for p in required if p not in paths]
          if missing:
              print('PR01 routes not fully deployed yet. Missing:', missing)
              raise SystemExit(1)
          print('PR01 API contract detected in production.')
          PY
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Render did not expose the PR01 API contract within smoke window.' >&2
          exit 1
