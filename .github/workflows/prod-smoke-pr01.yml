name: PR03 production smoke

on:
  push:
    branches: [ops/prod-smoke-pr01]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Render deployed PR03 API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            echo "Attempt ${attempt}/24"
            if curl -fsS --max-time 20 https://sgnc-web-api.onrender.com/openapi.json -o openapi.json; then
              if python - <<'PY'
          import json
          with open('openapi.json', encoding='utf-8') as f:
              doc = json.load(f)
          paths = doc.get('paths', {})
          required = [
              '/usuarios/opcoes-nc',
              '/insights',
              '/nc/{nc_id}/timeline',
          ]
          missing = [path for path in required if path not in paths]
          if missing:
              print('PR03 contract not fully deployed yet. Missing:', missing)
              raise SystemExit(1)
          print('PR03 API contract detected in production.')
          PY
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Render did not expose the PR03 API contract within smoke window.' >&2
          exit 1
