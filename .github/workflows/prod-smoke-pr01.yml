name: PR02 production smoke

on:
  push:
    branches: [ops/prod-smoke-pr01]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Render deployed PR02 API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            echo "Attempt ${attempt}/24"
            if curl -fsS --max-time 20 https://sgnc-web-api.onrender.com/ -o health.json; then
              if python - <<'PY'
          import json
          with open('health.json', encoding='utf-8') as f:
              doc = json.load(f)
          if doc.get('dominio') != 'recorrencia-v2':
              print('PR02 marker not deployed yet:', doc)
              raise SystemExit(1)
          print('PR02 API detected in production:', doc)
          PY
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Render did not expose the PR02 domain marker within smoke window.' >&2
          exit 1
