name: PR01 production rollback smoke

on:
  push:
    branches: [ops/prod-smoke-pr01]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Render reverted to pre-PR01 API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            echo "Attempt ${attempt}/18"
            if curl -fsS --max-time 20 https://sgnc-web-api.onrender.com/openapi.json -o openapi.json; then
              if python - <<'PY'
          import json
          with open('openapi.json', encoding='utf-8') as f:
              doc = json.load(f)
          paths = doc.get('paths', {})
          if '/usuarios/opcoes-nc' in paths:
              print('PR01 route still present; Render rollback not propagated yet.')
              raise SystemExit(1)
          if '/insights' not in paths:
              print('Baseline /insights route missing unexpectedly.')
              raise SystemExit(1)
          print('Pre-PR01 API contract detected in production.')
          PY
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Render did not return to the pre-PR01 API contract within smoke window.' >&2
          exit 1
